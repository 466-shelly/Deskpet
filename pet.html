<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; media-src 'self' file: blob:; img-src 'self' file: data: blob:;" />
  <title>Deskpet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-drag: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    /* 窗口尺寸仅由 config 写入的 px 控制，禁止 vw/vh 避免动画后膨胀 */
    #root {
      position: relative;
      overflow: hidden;
    }

    #media-wrap {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 0;
    }

    /* 仅对此内层做跳跃/震动，不影响 root 布局尺寸 */
    #pet-visual {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transform: translate3d(0, 0, 0) scale(1);
      transform-origin: center center;
    }

    #pet-visual.animate-jump {
      animation: pet-jump 0.55s ease;
      animation-fill-mode: none;
    }

    #pet-visual.animate-shake {
      animation: pet-shake 0.45s ease;
      animation-fill-mode: none;
    }

    @keyframes pet-jump {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      30% { transform: translate3d(0, -18px, 0) scale(1); }
      55% { transform: translate3d(0, -6px, 0) scale(1); }
      75% { transform: translate3d(0, -10px, 0) scale(1); }
    }

    @keyframes pet-shake {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      20% { transform: translate3d(-6px, 0, 0) scale(1) rotate(-2deg); }
      40% { transform: translate3d(6px, 0, 0) scale(1) rotate(2deg); }
      60% { transform: translate3d(-4px, 0, 0) scale(1); }
      80% { transform: translate3d(4px, 0, 0) scale(1); }
    }

    #pet-video,
    #pet-image,
    #placeholder,
    #placeholder svg,
    #placeholder-text {
      pointer-events: none;
    }

    #pet-video.hidden,
    #pet-image.hidden {
      display: none;
    }

    #pet-video,
    #pet-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    #placeholder {
      width: 80%;
      height: 80%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #64748b;
      font-size: 12px;
      text-align: center;
      animation: float 3s ease-in-out infinite;
    }

    #placeholder svg {
      width: 70%;
      height: auto;
      filter: drop-shadow(0 4px 12px rgba(110, 231, 255, 0.35));
    }

    @keyframes float {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(0, -6px, 0); }
    }

    /*
     * Windows + Electron 33 透明窗：-webkit-app-region:drag 对全透明像素无效。
     * 使用全屏 drag-handle + 主进程 setPosition 实现拖动。
     */
    #drag-handle {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: auto;
      -webkit-app-region: no-drag;
      cursor: grab;
      background: transparent;
    }

    #drag-handle.active {
      cursor: grabbing;
    }

    #hint-bar {
      position: absolute;
      bottom: 4px;
      left: 50%;
      transform: translateX(-50%);
      max-width: 92%;
      padding: 4px 10px;
      background: rgba(15, 23, 42, 0.72);
      color: #e2e8f0;
      font-size: 11px;
      border-radius: 999px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
      z-index: 5;
    }

    #hint-bar.visible {
      opacity: 1;
    }

    #bubble {
      position: absolute;
      top: -8px;
      left: 50%;
      transform: translate(-50%, -100%) scale(0.85);
      max-width: 220px;
      padding: 10px 14px;
      background: #fff;
      color: #1e293b;
      font-size: 13px;
      line-height: 1.45;
      border-radius: 14px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      z-index: 20;
    }

    #bubble::after {
      content: "";
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: #fff;
      border-bottom: none;
      pointer-events: none;
    }

    #bubble.show {
      opacity: 1;
      transform: translate(-50%, -100%) scale(1);
    }

    #action-btn {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      padding: 6px 14px;
      border: none;
      border-radius: 999px;
      background: linear-gradient(135deg, #6ee7ff, #a78bfa);
      color: #0f172a;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      -webkit-app-region: no-drag;
      transition: opacity 0.2s, transform 0.2s;
      box-shadow: 0 4px 14px rgba(110, 231, 255, 0.45);
      z-index: 10;
    }

    #root:hover #action-btn {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) scale(1);
    }

    #action-btn:active {
      transform: translateX(-50%) scale(0.95);
    }

    #hide-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 26px;
      height: 26px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.92);
      color: #fff;
      font-size: 14px;
      line-height: 1;
      font-weight: 700;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      -webkit-app-region: no-drag;
      transition: opacity 0.2s, transform 0.2s;
      box-shadow: 0 2px 10px rgba(239, 68, 68, 0.45);
      z-index: 30;
    }

    #root:hover #hide-btn {
      opacity: 1;
      pointer-events: auto;
    }

    #hide-btn:hover {
      transform: scale(1.08);
      background: rgba(220, 38, 38, 0.96);
    }

    #hide-btn:active {
      transform: scale(0.94);
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="media-wrap">
      <div id="pet-visual">
        <video id="pet-video" autoplay loop muted playsinline class="hidden"></video>
        <img id="pet-image" alt="deskpet" class="hidden" />
        <div id="placeholder">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#6ee7ff"/>
                <stop offset="100%" style="stop-color:#a78bfa"/>
              </linearGradient>
            </defs>
            <ellipse cx="100" cy="130" rx="55" ry="45" fill="url(#g)" opacity="0.9"/>
            <circle cx="100" cy="75" r="50" fill="url(#g)"/>
            <circle cx="82" cy="68" r="8" fill="#1e293b"/>
            <circle cx="118" cy="68" r="8" fill="#1e293b"/>
            <circle cx="84" cy="66" r="3" fill="#fff"/>
            <circle cx="120" cy="66" r="3" fill="#fff"/>
            <path d="M 85 88 Q 100 102 115 88" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
          </svg>
          <span id="placeholder-text">右键打开设置面板</span>
        </div>
      </div>
    </div>

    <div id="drag-handle" title="按住拖动"></div>

    <button id="action-btn" type="button">互动</button>
    <button id="hide-btn" type="button" title="隐藏桌宠">✖</button>
    <div id="bubble"></div>
    <div id="hint-bar"></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const root = document.getElementById('root');
    const mediaWrap = document.getElementById('media-wrap');
    const petVisual = document.getElementById('pet-visual');
    const dragHandle = document.getElementById('drag-handle');
    const petVideo = document.getElementById('pet-video');
    const petImage = document.getElementById('pet-image');
    const placeholder = document.getElementById('placeholder');
    const placeholderText = document.getElementById('placeholder-text');
    const actionBtn = document.getElementById('action-btn');
    const hideBtn = document.getElementById('hide-btn');
    const bubble = document.getElementById('bubble');
    const hintBar = document.getElementById('hint-bar');

    const IDLE_MS = 5 * 60 * 1000;
    let config = null;
    let idleTimer = null;
    let bubbleTimer = null;
    let hintTimer = null;
    let videoPausedByIdle = false;
    let dragOffset = null;

    function pickRandom(list) {
      if (!list || !list.length) return '';
      return list[Math.floor(Math.random() * list.length)];
    }

    function resetIdleTimer() {
      wakeMedia();
      clearTimeout(idleTimer);
      idleTimer = setTimeout(onIdleTimeout, IDLE_MS);
    }

    function onIdleTimeout() {
      if (petVideo && !petVideo.classList.contains('hidden')) {
        try {
          petVideo.pause();
          videoPausedByIdle = true;
        } catch (_) {}
      }
    }

    function wakeMedia() {
      if (videoPausedByIdle && petVideo && !petVideo.classList.contains('hidden')) {
        petVideo.play().catch(() => {});
        videoPausedByIdle = false;
      }
    }

    function applyMedia(cfg) {
      const mediaPath = cfg.mediaPath;
      const mediaType = cfg.mediaType || 'image';
      const isBundledDefault = !mediaPath || mediaPath.includes('default.svg');

      petVideo.classList.add('hidden');
      petImage.classList.add('hidden');
      placeholder.style.display = 'none';

      if (isBundledDefault) {
        placeholder.style.display = 'flex';
        placeholderText.textContent = pickRandom(cfg.idleMessages) || '右键打开设置面板';
        return;
      }

      const src = mediaPath.startsWith('file:') ? mediaPath : 'file:///' + mediaPath.replace(/\\/g, '/');

      if (mediaType === 'video') {
        petVideo.src = src;
        petVideo.classList.remove('hidden');
        petVideo.load();
        petVideo.play().catch(() => {});
      } else {
        petImage.src = src;
        petImage.classList.remove('hidden');
      }
    }

    const ANIM_JUMP = 'animate-jump';
    const ANIM_SHAKE = 'animate-shake';

    function clampSize(n) {
      const v = parseInt(n, 10);
      if (Number.isNaN(v)) return 200;
      return Math.min(600, Math.max(80, v));
    }

    /** 尺寸唯一来源：IPC config，禁止交互事件修改 */
    function applySize(cfg) {
      const w = clampSize(cfg && cfg.width);
      const h = clampSize(cfg && cfg.height);
      const pxW = w + 'px';
      const pxH = h + 'px';

      root.style.width = pxW;
      root.style.height = pxH;
      mediaWrap.style.width = pxW;
      mediaWrap.style.height = pxH;
      petVisual.style.width = pxW;
      petVisual.style.height = pxH;

      petVideo.style.width = '100%';
      petVideo.style.height = '100%';
      petImage.style.width = '100%';
      petImage.style.height = '100%';
    }

    function resetPetVisualTransform() {
      petVisual.classList.remove(ANIM_JUMP, ANIM_SHAKE);
      petVisual.style.transform = '';
    }

    function playInteractAnimation() {
      resetPetVisualTransform();
      void petVisual.offsetWidth;

      const cls = Math.random() > 0.5 ? ANIM_JUMP : ANIM_SHAKE;
      petVisual.classList.add(cls);

      const onEnd = (ev) => {
        if (ev.target !== petVisual) return;
        resetPetVisualTransform();
        petVisual.removeEventListener('animationend', onEnd);
      };
      petVisual.addEventListener('animationend', onEnd);
    }

    function applyConfig(cfg) {
      config = cfg;
      resetPetVisualTransform();
      applySize(cfg);
      actionBtn.textContent = cfg.buttonText || '互动';
      applyMedia(cfg);
      resetIdleTimer();
      rotateHint();
    }

    function rotateHint() {
      if (!config || !config.idleMessages || !config.idleMessages.length) {
        hintBar.classList.remove('visible');
        return;
      }
      hintBar.textContent = pickRandom(config.idleMessages);
      hintBar.classList.add('visible');
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => {
        hintBar.classList.remove('visible');
      }, 4000);
    }

    function showBubble(text) {
      bubble.textContent = text;
      bubble.classList.add('show');
      clearTimeout(bubbleTimer);
      bubbleTimer = setTimeout(() => bubble.classList.remove('show'), 3200);
    }

    function onDragMove(e) {
      if (!dragOffset) return;
      ipcRenderer.invoke(
        'set-window-position',
        e.screenX - dragOffset.x,
        e.screenY - dragOffset.y
      );
    }

    function onDragEnd() {
      if (!dragOffset) return;
      dragOffset = null;
      dragHandle.classList.remove('active');
      window.removeEventListener('mousemove', onDragMove);
      window.removeEventListener('mouseup', onDragEnd);
      snapIfOutOfBounds();
    }

    dragHandle.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;

      ipcRenderer.invoke('begin-window-drag', {
        screenX: e.screenX,
        screenY: e.screenY,
      }).then((result) => {
        if (!result) return;
        dragOffset = { x: result.offsetX, y: result.offsetY };
        dragHandle.classList.add('active');
        resetIdleTimer();
        window.addEventListener('mousemove', onDragMove);
        window.addEventListener('mouseup', onDragEnd);
      });
    });

    dragHandle.addEventListener('contextmenu', () => {
      ipcRenderer.invoke('open-panel');
    });

    actionBtn.addEventListener('click', () => {
      resetIdleTimer();
      const msg = pickRandom(config && config.responses);
      showBubble(msg || '你好！');
      playInteractAnimation();
    });

    hideBtn.addEventListener('click', () => {
      ipcRenderer.invoke('hide-pet-window');
    });

    document.body.addEventListener('mouseenter', resetIdleTimer);
    document.body.addEventListener('mousemove', resetIdleTimer);

    async function snapIfOutOfBounds() {
      const snap = await ipcRenderer.invoke('snap-window-to-screen');
      if (!snap) return;

      const { from, to, workArea } = snap;
      const w = from.width || (config && config.width) || 200;
      const h = from.height || (config && config.height) || 200;

      const outLeft = from.x < workArea.x;
      const outTop = from.y < workArea.y;
      const outRight = from.x + w > workArea.x + workArea.width;
      const outBottom = from.y + h > workArea.y + workArea.height;

      if (!outLeft && !outTop && !outRight && !outBottom) return;
      if (from.x === to.x && from.y === to.y) return;

      await animateWindowMove(from.x, from.y, to.x, to.y, 280);
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    async function animateWindowMove(fromX, fromY, toX, toY, duration) {
      const start = performance.now();
      return new Promise((resolve) => {
        function frame(now) {
          const t = Math.min(1, (now - start) / duration);
          const eased = easeOutCubic(t);
          const x = fromX + (toX - fromX) * eased;
          const y = fromY + (toY - fromY) * eased;
          ipcRenderer.invoke('set-window-position', x, y);
          if (t < 1) {
            requestAnimationFrame(frame);
          } else {
            resolve();
          }
        }
        requestAnimationFrame(frame);
      });
    }

    ipcRenderer.on('config-updated', (_event, cfg) => {
      applyConfig(cfg);
    });

    ipcRenderer.invoke('get-config').then((cfg) => {
      applyConfig(cfg);
    }).catch((err) => {
      console.error('load config failed', err);
    });
  </script>
</body>
</html>
