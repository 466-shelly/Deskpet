<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: blob:; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; media-src 'self' file: blob:; img-src 'self' file: data: blob:;" />
  <title>Deskpet</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-drag: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    }

    #root {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow: hidden;
    }

    /* 宽高设置仅控制此媒体区域 */
    #media-wrap {
      position: relative;
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    /* 仅对此内层做跳跃/震动，不影响 root 布局尺寸 */
    #pet-visual {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      transform: translate3d(0, 0, 0) scale(1);
      transform-origin: center center;
      opacity: 1;
      transition: opacity 0.28s ease;
    }

    #pet-visual.media-fade-out {
      opacity: 0;
    }

    #pet-visual.animate-jump {
      animation: pet-jump 0.55s ease;
      animation-fill-mode: none;
    }

    #pet-visual.animate-shake {
      animation: pet-shake 0.45s ease;
      animation-fill-mode: none;
    }

    @keyframes pet-jump {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      30% { transform: translate3d(0, -18px, 0) scale(1); }
      55% { transform: translate3d(0, -6px, 0) scale(1); }
      75% { transform: translate3d(0, -10px, 0) scale(1); }
    }

    @keyframes pet-shake {
      0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
      20% { transform: translate3d(-6px, 0, 0) scale(1) rotate(-2deg); }
      40% { transform: translate3d(6px, 0, 0) scale(1) rotate(2deg); }
      60% { transform: translate3d(-4px, 0, 0) scale(1); }
      80% { transform: translate3d(4px, 0, 0) scale(1); }
    }

    #pet-video,
    #pet-image,
    #placeholder,
    #placeholder svg,
    #placeholder-text {
      pointer-events: none;
    }

    #pet-video.hidden,
    #pet-image.hidden {
      display: none;
    }

    #pet-video,
    #pet-image {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    #placeholder {
      width: 80%;
      height: 80%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #64748b;
      font-size: 12px;
      text-align: center;
      animation: float 3s ease-in-out infinite;
    }

    #placeholder svg {
      width: 70%;
      height: auto;
      filter: drop-shadow(0 4px 12px rgba(110, 231, 255, 0.35));
    }

    @keyframes float {
      0%, 100% { transform: translate3d(0, 0, 0); }
      50% { transform: translate3d(0, -6px, 0); }
    }

    /*
     * Windows + Electron 33 透明窗：-webkit-app-region:drag 对全透明像素无效。
     * 使用全屏 drag-handle + 主进程 setPosition 实现拖动。
     */
    #drag-handle {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: auto;
      -webkit-app-region: no-drag;
      cursor: grab;
      background: transparent;
    }

    #drag-handle.active {
      cursor: grabbing;
    }

    #hint-bar {
      position: absolute;
      bottom: calc(36px + 4px);
      left: 50%;
      transform: translateX(-50%);
      max-width: 92%;
      padding: 4px 10px;
      background: rgba(15, 23, 42, 0.72);
      color: #e2e8f0;
      font-size: 11px;
      border-radius: 999px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
      z-index: 5;
    }

    #hint-bar.visible {
      opacity: 1;
    }

    /* 卡通对话气泡：桌宠左上方，宽高随文字自适应 */
    #bubble {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 50;
      width: fit-content;
      max-width: 200px;
      min-width: 48px;
      padding: 9px 12px;
      background: #ffffff;
      color: #111111;
      font-size: 13px;
      line-height: 1.5;
      font-weight: 500;
      border-radius: 14px;
      border: 1.5px solid rgba(0, 0, 0, 0.12);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
      opacity: 0;
      pointer-events: none;
      white-space: normal;
      word-wrap: break-word;
      overflow-wrap: break-word;
      transition: opacity 0.35s ease;
    }

    /* 小尾巴：指向右下方桌宠主体 */
    #bubble::after {
      content: "";
      position: absolute;
      bottom: -9px;
      right: 18px;
      width: 0;
      height: 0;
      border-left: 8px solid transparent;
      border-right: 8px solid transparent;
      border-top: 10px solid #ffffff;
      filter: drop-shadow(0 2px 1px rgba(0, 0, 0, 0.06));
    }

    #bubble.show {
      opacity: 1;
    }

    /* 日程提醒：媒体区下方独立文字带，不遮挡动画/视频 */
    #schedule-bubble {
      position: relative;
      flex: 0 0 36px;
      width: 100%;
      height: 36px;
      z-index: 100;
      padding: 0 8px;
      background: transparent;
      color: #7B8B6F;
      font-size: 16px;
      line-height: 36px;
      font-weight: 700;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      opacity: 0;
      pointer-events: none;
      -webkit-app-region: no-drag;
      transition: opacity 0.3s ease;
    }

    #schedule-bubble.show {
      opacity: 1;
    }

    #action-btn {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%) scale(0.9);
      padding: 6px 14px;
      border: 1px solid #000000;
      border-radius: 6px;
      background-color: #ffffff;
      color: #000000;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      -webkit-app-region: no-drag;
      transition: opacity 0.2s, transform 0.2s, background-color 0.15s, color 0.15s;
      box-shadow: none;
      z-index: 10;
    }

    #root:hover #action-btn {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) scale(1);
    }

    #action-btn:hover {
      background-color: #000000;
      color: #ffffff;
    }

    #action-btn:active {
      transform: translateX(-50%) scale(0.95);
    }

    #hide-btn {
      position: absolute;
      top: 4px;
      right: 4px;
      width: 26px;
      height: 26px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.92);
      color: #fff;
      font-size: 14px;
      line-height: 1;
      font-weight: 700;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      -webkit-app-region: no-drag;
      transition: opacity 0.2s, transform 0.2s;
      box-shadow: 0 2px 10px rgba(239, 68, 68, 0.45);
      z-index: 30;
    }

    #root:hover #hide-btn {
      opacity: 1;
      pointer-events: auto;
    }

    #hide-btn:hover {
      transform: scale(1.08);
      background: rgba(220, 38, 38, 0.96);
    }

    #hide-btn:active {
      transform: scale(0.94);
    }
  </style>
</head>
<body>
  <div id="root">
    <div id="media-wrap">
      <div id="pet-visual">
        <video id="pet-video" autoplay loop muted playsinline class="hidden"></video>
        <img id="pet-image" alt="deskpet" class="hidden" />
        <div id="placeholder">
          <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#6ee7ff"/>
                <stop offset="100%" style="stop-color:#a78bfa"/>
              </linearGradient>
            </defs>
            <ellipse cx="100" cy="130" rx="55" ry="45" fill="url(#g)" opacity="0.9"/>
            <circle cx="100" cy="75" r="50" fill="url(#g)"/>
            <circle cx="82" cy="68" r="8" fill="#1e293b"/>
            <circle cx="118" cy="68" r="8" fill="#1e293b"/>
            <circle cx="84" cy="66" r="3" fill="#fff"/>
            <circle cx="120" cy="66" r="3" fill="#fff"/>
            <path d="M 85 88 Q 100 102 115 88" stroke="#1e293b" stroke-width="3" fill="none" stroke-linecap="round"/>
          </svg>
          <span id="placeholder-text">右键打开设置面板</span>
        </div>
      </div>
    </div>

    <div id="schedule-bubble" role="status" aria-live="polite"></div>

    <div id="drag-handle" title="按住拖动"></div>

    <button id="action-btn" type="button">互动</button>
    <button id="hide-btn" type="button" title="隐藏桌宠">✖</button>
    <div id="bubble" role="status" aria-live="polite"></div>
    <div id="hint-bar"></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    const root = document.getElementById('root');
    const mediaWrap = document.getElementById('media-wrap');
    const petVisual = document.getElementById('pet-visual');
    const dragHandle = document.getElementById('drag-handle');
    const petVideo = document.getElementById('pet-video');
    const petImage = document.getElementById('pet-image');
    const placeholder = document.getElementById('placeholder');
    const placeholderText = document.getElementById('placeholder-text');
    const actionBtn = document.getElementById('action-btn');
    const hideBtn = document.getElementById('hide-btn');
    const bubble = document.getElementById('bubble');
    const scheduleBubble = document.getElementById('schedule-bubble');
    const hintBar = document.getElementById('hint-bar');

    const SCHEDULE_REMINDER_BAND_PX = 36;
    const SCHEDULE_REMINDER_EXTRA_WIDTH_PX = 40;

    const IDLE_MS = 5 * 60 * 1000;
    const MEDIA_ROTATE_MIN_MS = 2 * 60 * 1000;
    const MEDIA_ROTATE_MAX_MS = 5 * 60 * 1000;
    const EYE_PROTECT_INTERVAL_MS = 60 * 60 * 1000;
    const EYE_PROTECT_DURATION_MS = 5 * 60 * 1000;
    const EYE_PROTECT_MESSAGE = '已经陪伴你1小时啦，快看看窗外休息一下眼睛吧！';
    const SCHEDULE_REMINDER_DURATION_MS = 10 * 60 * 1000;

    let config = null;
    let responses = [];
    let idleMessages = [];
    let mediaItems = [];
    let currentMediaIndex = 0;
    let idleTimer = null;
    let mediaRotateTimer = null;
    let bubbleTimer = null;
    let hintTimer = null;
    let videoPausedByIdle = false;
    let dragOffset = null;
    let isSwitchingMedia = false;
    let lastMediaKey = '';
    let isEyeProtecting = false;
    let eyeProtectInterval = null;
    let snapAnimationFrame = null;
    let schedules = [];
    let scheduleBubbleTimer = null;
    let activeScheduleReminder = null;

    function pickRandom(list) {
      if (!list || !list.length) return '';
      return list[Math.floor(Math.random() * list.length)];
    }

    /** 从 IPC 语料数组随机抽取一条（Math.random） */
    function pickResponseText() {
      const pool = (Array.isArray(responses) && responses.length)
        ? responses
        : (config && Array.isArray(config.responses) ? config.responses : []);
      if (!pool.length) return '你好！';
      return pool[Math.floor(Math.random() * pool.length)];
    }

    /**
     * 展示卡通气泡：填入文本 → opacity:1
     * 疯狂点击时清除并重置定时器，每次重新计时 3~5 秒
     * options.durationMs — 自定义显示时长；options.forceEyeProtect — 护眼强提醒，不受互斥锁拦截
     */
    function showResponseBubble(text, options = {}) {
      if (isEyeProtecting && !options.forceEyeProtect) {
        return false;
      }

      const message = String(text || '').trim() || '你好！';

      clearTimeout(bubbleTimer);
      bubbleTimer = null;

      bubble.textContent = message;
      bubble.classList.add('show');

      const hideAfterMs = options.durationMs != null
        ? options.durationMs
        : 3000 + Math.floor(Math.random() * 2000);
      bubbleTimer = setTimeout(() => {
        bubble.classList.remove('show');
        bubbleTimer = null;
        if (options.onHide) options.onHide();
      }, hideAfterMs);
      return true;
    }

    function triggerEyeProtectReminder() {
      if (isEyeProtecting) return;

      isEyeProtecting = true;
      showResponseBubble(EYE_PROTECT_MESSAGE, {
        durationMs: EYE_PROTECT_DURATION_MS,
        forceEyeProtect: true,
        onHide: () => {
          isEyeProtecting = false;
        },
      });
    }

    function startEyeProtectSchedule() {
      clearInterval(eyeProtectInterval);
      eyeProtectInterval = setInterval(triggerEyeProtectReminder, EYE_PROTECT_INTERVAL_MS);
    }

    /** 展示下方日程提醒气泡（由主进程 schedule-reminder 事件驱动） */
    function showScheduleReminderBubble(schedule) {
      if (!schedule || !schedule.title) return;

      const local = schedules.find((item) => item.id === schedule.id);
      if (local) local.hasReminded = true;

      activeScheduleReminder = { ...schedule };
      scheduleBubble.textContent = `您有${schedule.title}事项待完成`;
      scheduleBubble.classList.add('show');

      clearTimeout(scheduleBubbleTimer);
      scheduleBubbleTimer = setTimeout(async () => {
        scheduleBubble.classList.remove('show');
        scheduleBubbleTimer = null;

        const finished = activeScheduleReminder;
        activeScheduleReminder = null;

        // 仅一次日程：10 分钟提醒结束后从 config.json 移除
        if (finished && !finished.repeatDaily) {
          try {
            await ipcRenderer.invoke('remove-schedule-item', finished.id);
          } catch (err) {
            console.error('[Deskpet] remove schedule failed', err);
          }
        }
      }, SCHEDULE_REMINDER_DURATION_MS);
    }

    /** 收到 IPC 配置后，第一时间覆盖本地日程数组 */
    function applySchedulesFromConfig(cfg) {
      schedules = Array.isArray(cfg.schedules)
        ? cfg.schedules.map((item) => ({
            id: item.id,
            title: item.title,
            timestamp: Number(item.timestamp),
            repeatDaily: Boolean(item.repeatDaily),
            hasReminded: false,
          }))
        : [];
    }

    /** 互动按钮 click：随机语料 + 气泡 + 动画 */
    function handleInteractClick(e) {
      e.stopPropagation();
      e.preventDefault();
      resetIdleTimer();

      if (isEyeProtecting) {
        console.log('[Deskpet] 护眼提醒进行中，已拦截日常互动语料');
        return;
      }

      showResponseBubble(pickResponseText());
      playInteractAnimation();
    }

    function getMediaItemsFromCfg(cfg) {
      if (Array.isArray(cfg.mediaItems) && cfg.mediaItems.length) return cfg.mediaItems;
      if (cfg.mediaPath) return [{ path: cfg.mediaPath, type: cfg.mediaType || 'image' }];
      return [];
    }

    function isDefaultItem(item) {
      return item && item.path && item.path.includes('default.svg');
    }

    function fileSrc(p) {
      if (!p) return '';
      if (p.startsWith('file:')) return p;
      return 'file:///' + p.replace(/\\/g, '/');
    }

    function pickRandomMediaIndex(excludeIndex) {
      if (mediaItems.length <= 1) return 0;
      let idx = excludeIndex;
      let guard = 0;
      while (idx === excludeIndex && guard < 20) {
        idx = Math.floor(Math.random() * mediaItems.length);
        guard += 1;
      }
      return idx;
    }

    function scheduleMediaRotation() {
      clearTimeout(mediaRotateTimer);
      if (mediaItems.length <= 1) return;
      const delay =
        MEDIA_ROTATE_MIN_MS +
        Math.floor(Math.random() * (MEDIA_ROTATE_MAX_MS - MEDIA_ROTATE_MIN_MS));
      mediaRotateTimer = setTimeout(async () => {
        const nextIndex = pickRandomMediaIndex(currentMediaIndex);
        await switchMediaByIndex(nextIndex, { animate: true });
        scheduleMediaRotation();
      }, delay);
    }

    function showMediaItem(item) {
      petVideo.classList.add('hidden');
      petImage.classList.add('hidden');
      placeholder.style.display = 'none';

      if (!item || isDefaultItem(item)) {
        placeholder.style.display = 'flex';
        placeholderText.textContent = pickRandom(idleMessages) || '右键打开设置面板';
        return;
      }

      const src = fileSrc(item.path);
      if (item.type === 'video') {
        if (petVideo.src !== src) {
          petVideo.pause();
          petVideo.src = src;
          petVideo.load();
        }
        petVideo.classList.remove('hidden');
        petVideo.play().catch(() => {});
      } else {
        petImage.src = src;
        petImage.classList.remove('hidden');
      }
    }

    /** 淡入淡出切换素材，避免黑屏闪烁 */
    async function switchMediaByIndex(index, { animate = true } = {}) {
      if (isSwitchingMedia || !mediaItems.length) return;
      const item = mediaItems[index];
      if (!item) return;

      isSwitchingMedia = true;
      try {
        if (animate && index !== currentMediaIndex) {
          petVisual.classList.add('media-fade-out');
          await new Promise((r) => setTimeout(r, 280));
        }
        currentMediaIndex = index;
        showMediaItem(item);
        petVisual.classList.remove('media-fade-out');
      } finally {
        isSwitchingMedia = false;
      }
    }

    async function rotateMediaRandomly({ animate = true } = {}) {
      if (mediaItems.length <= 1) return;
      const nextIndex = pickRandomMediaIndex(currentMediaIndex);
      await switchMediaByIndex(nextIndex, { animate });
    }

    function resetIdleTimer() {
      wakeMedia();
      clearTimeout(idleTimer);
      idleTimer = setTimeout(onIdleTimeout, IDLE_MS);
    }

    function onIdleTimeout() {
      if (petVideo && !petVideo.classList.contains('hidden')) {
        try {
          petVideo.pause();
          videoPausedByIdle = true;
        } catch (_) {}
      }
    }

    function wakeMedia() {
      const wasIdle = videoPausedByIdle;
      if (videoPausedByIdle && petVideo && !petVideo.classList.contains('hidden')) {
        petVideo.play().catch(() => {});
        videoPausedByIdle = false;
      }
      /* 闲置唤醒时随机切换状态 */
      if (wasIdle && mediaItems.length > 1) {
        rotateMediaRandomly({ animate: true });
      }
    }

    /** 加载素材：默认显示数组第一位；仅顺序/列表变更时重置到首位 */
    async function applyMediaFromList({ resetToFirst = false, animate = false } = {}) {
      if (!mediaItems.length) {
        showMediaItem(null);
        return;
      }
      if (resetToFirst) {
        currentMediaIndex = 0;
      } else if (currentMediaIndex >= mediaItems.length) {
        currentMediaIndex = 0;
      }
      await switchMediaByIndex(currentMediaIndex, { animate });
    }

    const ANIM_JUMP = 'animate-jump';
    const ANIM_SHAKE = 'animate-shake';

    function clampSize(n) {
      const v = parseInt(n, 10);
      if (Number.isNaN(v)) return 200;
      return Math.min(600, Math.max(80, v));
    }

    /** 配置宽高仅作用于媒体区；窗口总尺寸 = 媒体 + 底部 36px + 左右各扩 40px 宽 */
    function applySize(cfg) {
      const w = clampSize(cfg && cfg.width);
      const h = clampSize(cfg && cfg.height);
      const rootW = w + SCHEDULE_REMINDER_EXTRA_WIDTH_PX;
      const rootH = h + SCHEDULE_REMINDER_BAND_PX;

      root.style.width = rootW + 'px';
      root.style.height = rootH + 'px';
      mediaWrap.style.width = w + 'px';
      mediaWrap.style.height = h + 'px';
      petVisual.style.width = w + 'px';
      petVisual.style.height = h + 'px';
      scheduleBubble.style.height = SCHEDULE_REMINDER_BAND_PX + 'px';
      scheduleBubble.style.lineHeight = SCHEDULE_REMINDER_BAND_PX + 'px';

      petVideo.style.width = '100%';
      petVideo.style.height = '100%';
      petImage.style.width = '100%';
      petImage.style.height = '100%';
    }

    function resetPetVisualTransform() {
      petVisual.classList.remove(ANIM_JUMP, ANIM_SHAKE);
      petVisual.style.transform = '';
    }

    function playInteractAnimation() {
      resetPetVisualTransform();
      void petVisual.offsetWidth;

      const cls = Math.random() > 0.5 ? ANIM_JUMP : ANIM_SHAKE;
      petVisual.classList.add(cls);

      const onEnd = (ev) => {
        if (ev.target !== petVisual) return;
        resetPetVisualTransform();
        petVisual.removeEventListener('animationend', onEnd);
      };
      petVisual.addEventListener('animationend', onEnd);
    }

    /** 接收 IPC 配置：深拷贝语料/素材数组，彻底覆盖旧引用 */
    function applyConfig(cfg) {
      config = cfg;
      applySchedulesFromConfig(cfg);

      responses = Array.isArray(cfg.responses) ? cfg.responses.slice() : [];
      idleMessages = Array.isArray(cfg.idleMessages) ? cfg.idleMessages.slice() : [];
      mediaItems = getMediaItemsFromCfg(cfg).map((item) => ({ ...item }));

      resetPetVisualTransform();
      applySize(cfg);
      actionBtn.textContent = cfg.buttonText || '互动';

      /* 顺序敏感的 key：拖拽排序后也会触发重置到首位 */
      const mediaKey = JSON.stringify(mediaItems.map((m) => m.path));
      const mediaChanged = mediaKey !== lastMediaKey;

      applyMediaFromList({ resetToFirst: mediaChanged, animate: false });
      lastMediaKey = mediaKey;

      clearTimeout(mediaRotateTimer);
      scheduleMediaRotation();

      resetIdleTimer();
      rotateHint();
    }

    function rotateHint() {
      if (!idleMessages.length) {
        hintBar.classList.remove('visible');
        return;
      }
      hintBar.textContent = pickRandom(idleMessages);
      hintBar.classList.add('visible');
      clearTimeout(hintTimer);
      hintTimer = setTimeout(() => {
        hintBar.classList.remove('visible');
      }, 4000);
    }

    function showBubble(text) {
      showResponseBubble(text);
    }

    function onDragMove(e) {
      if (!dragOffset) return;
      ipcRenderer.invoke(
        'set-window-position',
        e.screenX - dragOffset.x,
        e.screenY - dragOffset.y
      );
    }

    function cancelSnapAnimation() {
      if (snapAnimationFrame != null) {
        cancelAnimationFrame(snapAnimationFrame);
        snapAnimationFrame = null;
      }
    }

    function onDragEnd() {
      if (!dragOffset) return;
      dragOffset = null;
      dragHandle.classList.remove('active');
      window.removeEventListener('mousemove', onDragMove);
      window.removeEventListener('mouseup', onDragEnd);
      snapIfOutOfBounds();
    }

    dragHandle.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;

      ipcRenderer.invoke('begin-window-drag', {
        screenX: e.screenX,
        screenY: e.screenY,
      }).then((result) => {
        if (!result) return;
        cancelSnapAnimation();
        dragOffset = { x: result.offsetX, y: result.offsetY };
        dragHandle.classList.add('active');
        resetIdleTimer();
        window.addEventListener('mousemove', onDragMove);
        window.addEventListener('mouseup', onDragEnd);
      });
    });

    dragHandle.addEventListener('contextmenu', () => {
      ipcRenderer.invoke('open-panel');
    });

    actionBtn.addEventListener('mousedown', (e) => e.stopPropagation());
    actionBtn.addEventListener('click', handleInteractClick);

    hideBtn.addEventListener('mousedown', (e) => e.stopPropagation());
    hideBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      ipcRenderer.invoke('hide-pet-window');
    });

    document.body.addEventListener('mouseenter', resetIdleTimer);
    document.body.addEventListener('mousemove', resetIdleTimer);

    async function snapIfOutOfBounds() {
      const snap = await ipcRenderer.invoke('snap-window-to-screen');
      if (!snap || !snap.needsSnap) return;

      const fromX = snap.from.x;
      const fromY = snap.from.y;
      const targetX = snap.to.x;
      const targetY = snap.to.y;

      if (fromX === targetX && fromY === targetY) return;

      await animateWindowMove(fromX, fromY, targetX, targetY, 280);
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    async function animateWindowMove(fromX, fromY, toX, toY, duration) {
      cancelSnapAnimation();

      const startX = fromX;
      const startY = fromY;
      const endX = toX;
      const endY = toY;
      const startTime = performance.now();

      return new Promise((resolve) => {
        function frame(now) {
          const t = Math.min(1, (now - startTime) / duration);

          if (t >= 1) {
            snapAnimationFrame = null;
            ipcRenderer.invoke('set-window-position', endX, endY).then(resolve);
            return;
          }

          const eased = easeOutCubic(t);
          const x = startX + (endX - startX) * eased;
          const y = startY + (endY - startY) * eased;
          ipcRenderer.invoke('set-window-position', x, y);
          snapAnimationFrame = requestAnimationFrame(frame);
        }

        snapAnimationFrame = requestAnimationFrame(frame);
      });
    }

    ipcRenderer.on('config-updated', (_event, cfg) => {
      applyConfig(cfg);
    });

    ipcRenderer.on('schedule-reminder', (_event, schedule) => {
      showScheduleReminderBubble(schedule);
    });

    ipcRenderer.invoke('get-config').then((cfg) => {
      applyConfig(cfg);
      startEyeProtectSchedule();
    }).catch((err) => {
      console.error('load config failed', err);
    });
  </script>
</body>
</html>
